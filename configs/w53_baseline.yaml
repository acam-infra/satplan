name: w53_baseline
title: "satplan baseline: Walker 53 4x10 + 3 RS (nearest + none)"
trace: ../../satsim/input/traces/coop-w53.trace.json
scenario: ../../satsim/input/traces/coop-w53.scenario.json
delivery: final
control_period_s: 2.0
frame_s: 10.0
placer: nearest
planner: none
seeds: [1]

model:
  layers: 32
  kv_heads: 8
  head_dim: 128
  bytes_per_elem: 2

gpu:
  kv_gib: 24.0
  t_fixed_s: 0.003
  t_weights_s: 0.01
  t_kv_tok_s: 1.0e-7
  t_seq_s: 5.0e-5
  mem_freq_exp: 0.6

power:
  P_idle: 60
  P_max: 300
  gamma: 2.4
  f_min: 0.35
  P_dark: 80

thermal:
  T0_C: 25.0
  T_amb_C: 20.0
  T_max_C: 85.0
  R_th: 0.2
  C_th: 150.0

net:
  link_gbps:
    intra: 10.0
    inter: 10.0
    rs: 5.0
  hop_latency_s: 0.005

workload:
  arrival_window_s: 5400
  rate_per_rs_per_min: 45
  p_long: 0.35
  long_out: [6000, 18000]
  short_out: [200, 1200]
  long_pin: 2000
  short_pin: 500
  long_upload_MB: 500
  short_upload_MB: 50

slo:
  deadline_factor_long: 2.0
  deadline_factor_short: 4.0
  min_deadline_s: 120
  max_stall_frac: 0.1

name: p5_fair_matrix
title: "LAB-2025 P5 Bounded W53 3x3 Fair Matrix & Same-Info Forecast Ablation"
trace: inputs/coop-w53-600s.trace.json
scenario: inputs/coop-w53.scenario.json
delivery: final
rs_downlink: false
control_period_s: 2.0
frame_s: 10.0
seeds: [1, 2, 3]

rebalance_invariants:
  interval_s: 5.0
  max_inflight: 24
  max_mig_per_req: 4

r3:
  horizon_slots: 6
  tail_enabled: true
  tail_slots: 4
  tail_dt_s: 30.0
  time_limit_s: 0.5

demand_forecast:
  enabled: false
  obs_window_s: 120.0
  prior_rate_per_s: 0.0
  max_predicted_requests_per_slot: 4.0

model:
  layers: 32
  kv_heads: 8
  head_dim: 128
  bytes_per_elem: 2

gpu:
  kv_gib: 24.0
  t_fixed_s: 0.003
  t_weights_s: 0.01
  t_kv_tok_s: 1.0e-7
  t_seq_s: 5.0e-5
  mem_freq_exp: 0.6

power:
  P_idle: 60
  P_max: 300
  gamma: 2.4
  f_min: 0.35
  P_dark: 80
  eclipse_dod_budget_j: 150000.0
  tiers:
    - name: idle_0w
      power_w: 0.0
      clock_f: 0.0
    - name: low_25w
      power_w: 25.0
      clock_f: 0.35
    - name: high_300w
      power_w: 300.0
      clock_f: 1.0

thermal:
  T0_C: 25.0
  T_amb_C: 20.0
  T_max_C: 85.0
  R_th: 0.2
  C_th: 150.0

net:
  link_gbps:
    intra: 10.0
    inter: 1.5
    rs: 5.0
  hop_latency_s: 0.005

workload:
  arrival_window_s: 400.0
  source_rates_per_min: [48.0, 6.0, 6.0]
  rate_per_rs_per_min: 20
  p_long: 0.35
  long_out: [18000, 36000]
  short_out: [200, 1200]
  long_pin: 4000
  short_pin: 500
  long_upload_MB: 500
  short_upload_MB: 50

slo:
  deadline_factor_long: 1.6
  deadline_factor_short: 4.0
  min_deadline_s: 120
  max_stall_frac: 0.1

name: lab2046_w53_validation
title: "LAB-2046 W53 Paired Validation: B (Static) vs C (Attribution) vs O (Zero-Cost Lookahead)"
provenance:
  base_config: "satplan/configs/w53_baseline.yaml"
  trace: "satsim/input/traces/coop-w53.trace.json (40 CS + 3 RS, 7200s)"
  constrained_overrides:
    thermal: "T0=25.0C, T_amb=20.0C, T_max=85.0C, R_th=0.25 K/W -> T_eq(20W)=25.0<=T0, T_eq(300W)=95.0>85.0"
    tiers: "idle_0w (0W, 0.0), low_20w (20W, 0.35), high_300w (300W, 1.0)"
    eclipse_dod_budget_j: 100000.0
    net_inter_gbps: 0.35
  exploration_criterion:
    primary_metric: "goodput_tok_s"
    secondary_metric: "good_long_frac"
    note: "Verify (1) constrained W53 has avoidable loss vs C_both and (2) O_nearest_quota achieves >= +20% Goodput and > +5pp long_slo over B_nearest on same initial placement."

horizon_s: 1500.0
arrival_window_s: 400.0
seeds: [1, 2, 3]
rebalance_invariants:
  interval_s: 5.0
  max_inflight: 24
  max_mig_per_req: 4

name: lab2046_w53_validation
title: "LAB-2046 W53 Paired Validation: B (Static) vs C (Attribution) vs O (Frozen-Placement Zero-Cost Lookahead)"
base_config: "../../configs/w53_baseline.yaml"
horizon_s: 3600.0
arrival_window_s: 400.0
seeds: [1, 2, 3]
rebalance_invariants:
  interval_s: 5.0
  max_inflight: 24
  max_mig_per_req: 4
unlim_invariants:
  interval_s: 5.0
  max_inflight: 999
  max_mig_per_req: 999
oracle_lookahead_s: 90.0

scenarios:
  w53_original:
    description: "Original w53_baseline.yaml (T_eq=80C < 85C, no tiers, inter=1.5G)"
    overrides: {}
  w53_constrained:
    description: "Thermal/DoD/narrow-ISL active (T_eq_low=25C<=25C, T_eq_high=95C>85C, DoD=100kJ, inter=0.35G)"
    overrides:
      power:
        eclipse_dod_budget_j: 100000.0
        tiers:
          - {name: idle_0w, power_w: 0.0, clock_f: 0.0}
          - {name: low_20w, power_w: 20.0, clock_f: 0.35}
          - {name: high_300w, power_w: 300.0, clock_f: 1.0}
      thermal:
        T0_C: 25.0
        T_amb_C: 20.0
        T_max_C: 85.0
        R_th: 0.25
      net:
        link_gbps:
          inter: 0.35

exploration_criterion:
  primary_metric: "goodput_tok_s"
  secondary_metric: "good_long_frac"
  note: "Verify (1) constrained W53 has avoidable loss vs C_both and (2) O_nearest_frozen_quota achieves >= +20% Goodput and > +5pp long_slo over B_nearest with identical initial placement."

[project]
name = "satplan"
version = "0.1.0"
description = "Clean r3 time-expanded runtime reallocation engine and 3x3 cross-matrix."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "simpy>=4.1.2",
]

[project.scripts]
satplan = "satplan.runner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: small pure-model or module tests without a full simulation",
    "regression: bounded invariant checks at public simulation seams",
    "e2e: runner and suite wiring with one seed and a short horizon",
]
